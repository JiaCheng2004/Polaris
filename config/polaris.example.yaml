# Polaris full reference config.
# Copy this file and tailor it for a real deployment. Secrets must stay in the
# environment and should never be committed here as literals.

version: 2

imports:
  - ./providers/openai.yaml
  - ./providers/anthropic.yaml
  - ./providers/google.yaml
  - ./providers/google-vertex.yaml
  - ./providers/deepseek.yaml
  - ./providers/bytedance.yaml
  - ./providers/minimax.yaml
  - ./providers/elevenlabs.yaml
  - ./providers/xai.yaml
  - ./providers/openrouter.yaml
  - ./providers/together.yaml
  - ./providers/groq.yaml
  - ./providers/fireworks.yaml
  - ./providers/mistral.yaml
  - ./providers/bedrock.yaml
  - ./providers/nvidia.yaml
  - ./providers/replicate.yaml
  - ./providers/qwen.yaml
  - ./providers/ollama.yaml
  - ./routing/example.yaml

runtime:
  server:
    host: 0.0.0.0
    port: 8080
    read_timeout: 30s
    write_timeout: 120s
    shutdown_timeout: 15s
    max_body_bytes: 67108864
    cors:
      enabled: true
      allowed_origins:
        - https://app.example.com
      allowed_headers: [Authorization, Content-Type, X-Request-ID, X-Polaris-Admin-Key]
      allowed_methods: [GET, POST, DELETE, OPTIONS]
      exposed_headers: [X-Request-ID, X-RateLimit-Remaining, Retry-After, X-Polaris-Fallback, X-Polaris-Resolved-Model, X-Polaris-Resolved-Provider]
      allow_credentials: false
      max_age: 1h

  auth:
    mode: virtual_keys
    external:
      provider: signed_headers
      shared_secret: ${POLARIS_EXTERNAL_AUTH_SECRET}
      max_clock_skew: 60s
      cache_ttl: 60s
    bootstrap_admin_key_hash: ${POLARIS_BOOTSTRAP_ADMIN_KEY_HASH}

  store:
    driver: postgres
    dsn: ${DATABASE_URL}
    max_connections: 20
    log_retention_days: 90
    log_buffer_size: 1000
    log_flush_interval: 5s

  cache:
    driver: redis
    url: ${REDIS_URL}
    rate_limit:
      enabled: true
      default: 60/min
      window: sliding
    response_cache:
      enabled: false
      ttl: 24h
      max_entries_per_model: 100
      similarity_threshold: 0.95
      # Embedding (L2) semantic cache. Off by default; when enabled, paraphrased
      # requests hit the cache. Isolated per model/settings/project/epoch.
      semantic:
        enabled: false
        embedder: registry
        embedding_model: openai/text-embedding-3-small
        max_turns: 4
        max_temperature: 0.3

  files:
    enabled: true
    ingestion:
      max_upload_bytes: 524288000
      allowed_mime:
        - application/pdf
        - application/json
        - application/xml
        - application/x-yaml
        - application/yaml
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - text/*
        - image/*
        - audio/*
    storage:
      inline_max_bytes: 5242880
      blob_store: none # none | disk | s3
      disk_path: ./data/files
      s3:
        endpoint: ${POLARIS_FILES_S3_ENDPOINT}
        bucket: ${POLARIS_FILES_S3_BUCKET}
        region: ${POLARIS_FILES_S3_REGION}
        access_key_id: ${POLARIS_FILES_S3_ACCESS_KEY_ID}
        secret_access_key: ${POLARIS_FILES_S3_SECRET_ACCESS_KEY}
        use_ssl: true
    downloads:
      token_ttl: 10m
    ssrf:
      allowed_schemes: [https]
      deny_hosts:
        - 169.254.169.254
        - metadata.google.internal
    materialization:
      inline_fallback_max: 5242880
    understanding:
      enabled: false
      mode: disabled # disabled | explicit | auto_fallback
      profile: fast # fast | balanced | quality
      max_bytes: 5242880
      max_text_chars: 12000
      cache_artifacts: true
      chunking:
        enabled: false
        max_chars: 1800
        overlap_chars: 200
      processors:
        # Optional Apache Tika Server for broad document extraction and OCR.
        - enabled: false
          name: tika
          backend: tika
          endpoint: http://127.0.0.1:9998
          profiles: [balanced, quality]
          priority: 300
          mime_types: ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.openxmlformats-officedocument.presentationml.presentation", "image/*"]
          ocr: true
        # Optional canonical HTTP wrapper for Textract, Document AI, Azure Document Intelligence, VLM captioning, or embedding services.
        - enabled: false
          name: document_ai_layout
          backend: remote_http
          endpoint: http://127.0.0.1:9009/v1/process
          profiles: [quality]
          priority: 500
          mime_types: ["application/pdf", "image/*"]
          artifacts: [ocr_text, layout, table, form]
          capabilities: [ocr, layout, table_extract, form_extract]

  control_plane:
    enabled: true

  tools:
    enabled: true
    local:
      echo:
        implementation: echo
      time-now:
        implementation: time.now
      math-add:
        implementation: math.add

  mcp:
    enabled: true

  pricing:
    # Optional operator overrides. Bundled defaults are always loaded first.
    file: "" # e.g. ./pricing.yaml
    reload_interval_seconds: 30
    fail_on_missing: false

  observability:
    metrics:
      enabled: true
      path: /metrics
    logging:
      level: info
      format: json
    traces:
      enabled: false
      endpoint: ${POLARIS_OTEL_ENDPOINT}
      insecure: true
      service_name: polaris
      sample_ratio: 1.0
    audit:
      enabled: true
