name: Bug report
description: Report a problem with Polaris
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** report security issues here — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Polaris version
      placeholder: "v1.0.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal request or config that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Your polaris.yaml with secrets redacted, and any relevant env.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (redact keys and prompts).
      render: shell
