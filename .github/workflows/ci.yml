name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by golangci-lint new-from-merge-base

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        run: make lint

      - name: SDK doc coverage (revive exported, pkg/client)
        run: make doc-check

      - name: OpenAPI quality (vacuum)
        run: make openapi-lint

      - name: Config-key doc completeness
        run: make docs-config-check

      - name: gosec
        run: make security-check

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polaris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POLARIS_TEST_POSTGRES_DSN: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
      POLARIS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Unit + integration tests (race, coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Build binary
        run: go build ./cmd/polaris

      - name: Build Docker image
        run: docker build -f deployments/Dockerfile -t polaris:ci .

      - name: Quickstart smoke (container starts + serves /health)
        run: |
          docker run -d --name polaris-ci -p 8080:8080 polaris:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "container healthy"; docker rm -f polaris-ci; exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy within 30s"; docker logs polaris-ci; docker rm -f polaris-ci; exit 1

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: REUSE lint (SPDX/licensing compliance)
        run: pipx run reuse lint

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Dependency license compatibility
        run: make license-check

  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --dry-run
