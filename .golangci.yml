version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    depguard:
      rules:
        # Architecture layering (plan §4.1). Provider adapters and the tool
        # registry must not depend on the HTTP gateway layer; they use the
        # neutral internal/apierror and internal/obs packages instead. Existing
        # violations are now zero, so this rule catches any regression on changed
        # lines. `make check-layering` additionally hard-enforces it over the
        # whole tree (independent of the merge-base baseline) and runs in
        # release-check.
        provider-and-tooling:
          list-mode: lax
          files:
            - "**/internal/provider/**"
            - "**/internal/tooling/**"
          deny:
            - pkg: github.com/JiaCheng2004/Polaris/internal/gateway
              desc: "provider/tooling layers must not import the gateway layer (use internal/apierror, internal/obs)"
        # Foundation packages stay dependency-light: no gateway or provider imports.
        foundation:
          list-mode: lax
          files:
            - "**/internal/apierror/**"
            - "**/internal/obs/**"
            - "**/internal/transport/**"
            - "**/internal/modality/**"
          deny:
            - pkg: github.com/JiaCheng2004/Polaris/internal/gateway
              desc: "foundation packages must not import the gateway layer"
            - pkg: github.com/JiaCheng2004/Polaris/internal/provider
              desc: "foundation packages must not import provider adapters"
    revive:
      rules:
        # Exported-symbol doc enforcement runs as a dedicated, tree-wide gate
        # scoped to the public SDK: `make doc-check` (see .revive-doc.toml).
        # Enabling it repo-wide here would flag internal/ (not a public API) and
        # bury the new-issue signal.
        - name: exported
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
  exclusions:
    generated: strict
    rules:
      # Generated ByteDance protobuf under astpb/ is vendored, not hand-written.
      - path: internal/provider/bytedance/astpb/
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Baseline the pre-overhaul backlog: only fail on issues introduced relative
  # to the merge-base with main. Regressions fail; legacy debt is burned down
  # phase by phase. Requires full git history in CI (fetch-depth: 0).
  new-from-merge-base: main
  max-issues-per-linter: 0
  max-same-issues: 0
