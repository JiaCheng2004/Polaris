openapi: 3.1.0
info:
  title: Polaris API
  version: 1.0.0
  summary: Machine-readable contract for the Polaris HTTP gateway.
  description: |
    This file is the CI-checkable public HTTP contract for Polaris.
    docs/API_REFERENCE.md remains the human-readable companion.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://gateway.example.com
    description: Production deployment (replace with your own host)
tags:
  - name: health
  - name: mcp
  - name: gateway
  - name: control-plane
security:
  - bearerAuth: []
paths:
  /health:
    get: {operationId: healthLiveness, tags: [health], security: [], responses: {"200": {$ref: "#/components/responses/JSONOK"}}}
  /ready:
    get: {operationId: healthReadiness, tags: [health], security: [], responses: {"200": {$ref: "#/components/responses/JSONOK"}}}
  /metrics:
    get: {operationId: prometheusMetrics, tags: [health], security: [], responses: {"200": {description: Prometheus metrics, content: {text/plain: {schema: {type: string}}}}}}

  /mcp/{binding_id}:
    get: {operationId: mcpGetBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: mcpPostBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    put: {operationId: mcpPutBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    patch: {operationId: mcpPatchBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    head: {operationId: mcpHeadBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {description: OK}, default: {description: Error}}}
    options: {operationId: mcpOptionsBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {description: OK}, default: {description: Error}}}
    delete: {operationId: mcpDeleteBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    trace: {operationId: mcpTraceBindingRoot, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /mcp/{binding_id}/{path}:
    get: {operationId: mcpGetBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: mcpPostBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    put: {operationId: mcpPutBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    patch: {operationId: mcpPatchBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    head: {operationId: mcpHeadBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {description: OK}, default: {description: Error}}}
    options: {operationId: mcpOptionsBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {description: OK}, default: {description: Error}}}
    delete: {operationId: mcpDeleteBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    trace: {operationId: mcpTraceBindingPath, tags: [mcp], parameters: [{$ref: "#/components/parameters/BindingID"}, {$ref: "#/components/parameters/WildcardPath"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}

  /v1/models:
    get: {operationId: listModels, tags: [gateway], parameters: [{$ref: "#/components/parameters/IncludeAliases"}], responses: {"200": {description: Model list, content: {application/json: {schema: {$ref: "#/components/schemas/ModelListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/model-capabilities:
    get: {operationId: listModelCapabilities, tags: [gateway], parameters: [{$ref: "#/components/parameters/IncludeAliases"}], responses: {"200": {description: Structured model capability metadata, content: {application/json: {schema: {$ref: "#/components/schemas/ModelListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/usage:
    get: {operationId: getUsage, tags: [gateway], responses: {"200": {description: Usage report, content: {application/json: {schema: {$ref: "#/components/schemas/UsageReport"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/chat/completions:
    post: {operationId: createChatCompletion, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChatCompletionRequest"}}}}, responses: {"200": {description: Chat completion, content: {application/json: {schema: {$ref: "#/components/schemas/ChatCompletion"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/responses:
    post: {operationId: createResponse, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/messages:
    post: {operationId: createMessage, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/embeddings:
    post: {operationId: createEmbedding, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EmbeddingRequest"}}}}, responses: {"200": {description: Embeddings, content: {application/json: {schema: {$ref: "#/components/schemas/EmbeddingResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/tokens/count:
    post: {operationId: countTokens, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TokenCountRequest"}}}}, responses: {"200": {description: Token count, content: {application/json: {schema: {$ref: "#/components/schemas/TokenCountResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/files:
    get: {operationId: listFiles, tags: [gateway], responses: {"200": {description: File list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createFile, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {type: object}}, multipart/form-data: {schema: {type: object}}}}, responses: {"200": {description: File object, content: {application/json: {schema: {$ref: "#/components/schemas/FileObject"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/files/{id}:
    get: {operationId: getFile, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: File object, content: {application/json: {schema: {$ref: "#/components/schemas/FileObject"}}}}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: deleteFile, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"204": {description: Deleted}, default: {$ref: "#/components/responses/Error"}}}
  /v1/files/{id}/content:
    get: {operationId: getFileContent, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: File bytes}, default: {$ref: "#/components/responses/Error"}}}
  /v1/files/{id}/materialize:
    post: {operationId: materializeFile, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Provider file materialization, content: {application/json: {schema: {$ref: "#/components/schemas/FileMaterialization"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/batches:
    post: {operationId: createBatch, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/batches/{id}:
    get: {operationId: getBatch, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: cancelBatch, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"204": {description: Cancelled}, default: {$ref: "#/components/responses/Error"}}}
  /v1/batches/{id}/output:
    get: {operationId: getBatchOutput, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Batch output}, default: {$ref: "#/components/responses/Error"}}}
  /v1/translations:
    post: {operationId: createTranslation, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TranslationRequest"}}}}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}

  /v1/images/generations:
    post: {operationId: createImageGeneration, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ImageGenerationRequest"}}}}, responses: {"200": {description: Generated images, content: {application/json: {schema: {$ref: "#/components/schemas/ImageResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/images/edits:
    post: {operationId: createImageEdit, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/Multipart"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}

  /v1/video/generations:
    post: {operationId: createVideoGeneration, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/VideoGenerationRequest"}}}}, responses: {"200": {description: Video job, content: {application/json: {schema: {$ref: "#/components/schemas/AsyncJob"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/video/generations/{id}:
    get: {operationId: getVideoGeneration, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Video status, content: {application/json: {schema: {$ref: "#/components/schemas/AsyncJob"}}}}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: cancelVideoGeneration, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/video/generations/{id}/content:
    get: {operationId: getVideoContent, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Binary video content}, default: {$ref: "#/components/responses/Error"}}}

  /v1/audio/speech:
    post: {operationId: createSpeech, tags: [gateway], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SpeechRequest"}}}}, responses: {"200": {description: Audio bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/transcriptions:
    post: {operationId: createTranscription, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/Multipart"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/transcriptions/stream:
    post: {operationId: createStreamingTranscriptionSession, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {description: Streaming transcription session, content: {application/json: {schema: {$ref: "#/components/schemas/SessionDescriptor"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/transcriptions/stream/{id}/ws:
    get: {operationId: streamingTranscriptionWebSocket, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"101": {description: WebSocket upgrade}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/sessions:
    post: {operationId: createAudioSession, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {description: Audio session, content: {application/json: {schema: {$ref: "#/components/schemas/SessionDescriptor"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/sessions/{id}/ws:
    get: {operationId: audioSessionWebSocket, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"101": {description: WebSocket upgrade}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/interpreting/sessions:
    post: {operationId: createInterpretingSession, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {description: Interpreting session, content: {application/json: {schema: {$ref: "#/components/schemas/SessionDescriptor"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/interpreting/sessions/{id}/ws:
    get: {operationId: interpretingWebSocket, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"101": {description: WebSocket upgrade}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/notes:
    post: {operationId: createAudioNote, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {description: Audio note job, content: {application/json: {schema: {$ref: "#/components/schemas/AsyncJob"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/notes/{id}:
    get: {operationId: getAudioNote, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: deleteAudioNote, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/podcasts:
    post: {operationId: createPodcast, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {description: Podcast job, content: {application/json: {schema: {$ref: "#/components/schemas/AsyncJob"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/podcasts/{id}:
    get: {operationId: getPodcast, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: cancelPodcast, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/audio/podcasts/{id}/content:
    get: {operationId: getPodcastContent, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Podcast audio content}, default: {$ref: "#/components/responses/Error"}}}

  /v1/music/generations:
    post: {operationId: createMusicGeneration, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/music/edits:
    post: {operationId: createMusicEdit, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/Multipart"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/music/stems:
    post: {operationId: createMusicStems, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/music/lyrics:
    post: {operationId: createLyrics, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/music/plans:
    post: {operationId: createMusicPlan, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/music/jobs/{id}:
    get: {operationId: getMusicJob, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Music job, content: {application/json: {schema: {$ref: "#/components/schemas/AsyncJob"}}}}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: cancelMusicJob, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/music/jobs/{id}/content:
    get: {operationId: getMusicJobContent, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Music content}, default: {$ref: "#/components/responses/Error"}}}

  /v1/voices:
    get: {operationId: listVoices, tags: [gateway], responses: {"200": {description: Voice list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/{id}:
    get: {operationId: getVoice, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    delete: {operationId: deleteVoiceProviderSide, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/{id}/archive:
    post: {operationId: archiveVoice, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/{id}/unarchive:
    post: {operationId: unarchiveVoice, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/{id}/retrain:
    post: {operationId: retrainVoice, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/{id}/activate:
    post: {operationId: activateVoice, tags: [gateway], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/clones:
    post: {operationId: createVoiceClone, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/voices/designs:
    post: {operationId: createVoiceDesign, tags: [gateway], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}

  /v1/keys:
    get: {operationId: listLegacyKeys, tags: [control-plane], responses: {"200": {description: Key list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createLegacyKey, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/keys/{id}:
    delete: {operationId: deleteLegacyKey, tags: [control-plane], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/projects:
    get: {operationId: listProjects, tags: [control-plane], responses: {"200": {description: Project list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createProject, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {description: Project, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}, default: {$ref: "#/components/responses/Error"}}}
  /v1/virtual_keys:
    get: {operationId: listVirtualKeys, tags: [control-plane], responses: {"200": {description: Virtual key list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createVirtualKey, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/virtual_keys/{id}:
    delete: {operationId: deleteVirtualKey, tags: [control-plane], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/policies:
    get: {operationId: listPolicies, tags: [control-plane], responses: {"200": {description: Policy list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createPolicy, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/budgets:
    get: {operationId: listBudgets, tags: [control-plane], responses: {"200": {description: Budget list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createBudget, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/tools:
    get: {operationId: listTools, tags: [control-plane], responses: {"200": {description: Tool list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createTool, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/toolsets:
    get: {operationId: listToolsets, tags: [control-plane], responses: {"200": {description: Toolset list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createToolset, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/mcp/bindings:
    get: {operationId: listMCPBindings, tags: [control-plane], responses: {"200": {description: MCP binding list, content: {application/json: {schema: {$ref: "#/components/schemas/ListResponse"}}}}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: createMCPBinding, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /v1/admin/usage:
    get:
      operationId: adminUsage
      tags: [control-plane]
      summary: Admin usage analytics with scope and breakdowns
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [global, project, key]}}
        - {name: group_by, in: query, schema: {type: string, enum: [day, model, provider, modality, status, token_source, cost_source, error_type, interface_family]}}
        - {name: project_id, in: query, schema: {type: string}}
        - {name: key_id, in: query, schema: {type: string}}
        - {name: model, in: query, schema: {type: string}}
        - {name: provider, in: query, schema: {type: string}}
        - {name: modality, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}
  /v1/admin/audit-events:
    get:
      operationId: adminAuditEvents
      tags: [control-plane]
      summary: List control-plane audit events (paginated)
      parameters:
        - {name: project_id, in: query, schema: {type: string}}
        - {name: actor_key_id, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}
  /v1/admin/cache/purge:
    post: {operationId: purgeSemanticCache, tags: [control-plane], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
  /mcp:
    get: {operationId: mcpAggregateMetadata, tags: [mcp], responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}
    post: {operationId: mcpAggregateRpc, tags: [mcp], requestBody: {$ref: "#/components/requestBodies/JSON"}, responses: {"200": {$ref: "#/components/responses/JSONOK"}, default: {$ref: "#/components/responses/Error"}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Polaris API key presented as a Bearer token:
        `Authorization: Bearer <key>`. Keys are provisioned through the control
        plane or static config; the gateway persists only their SHA-256 hash.
        MCP endpoints may additionally accept OAuth 2.1 bearer tokens when
        `mcp.auth` includes `oauth`.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string}
    BindingID:
      name: binding_id
      in: path
      required: true
      schema: {type: string}
    WildcardPath:
      name: path
      in: path
      required: true
      schema: {type: string}
    IncludeAliases:
      name: include_aliases
      in: query
      required: false
      schema: {type: boolean}
  requestBodies:
    JSON:
      required: true
      content:
        application/json:
          schema: {type: object}
    Multipart:
      required: true
      content:
        multipart/form-data:
          schema: {type: object}
  responses:
    JSONOK:
      description: JSON response
      content:
        application/json:
          schema: {type: object}
    Error:
      description: Polaris error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RoutingOptions:
      type: object
      description: Optional directives that steer provider/model selection for a request.
      properties:
        providers: {type: array, items: {type: string}}
        exclude_providers: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        statuses: {type: array, items: {type: string}}
        verification_classes: {type: array, items: {type: string}}
        prefer: {type: array, items: {type: string}}
        cost_tier: {type: string}
        latency_tier: {type: string}
    ContentPart:
      type: object
      description: One part of a structured, multi-modal message (text, image, audio, file, …).
      required: [type]
      properties:
        type: {type: string, description: "Part kind, e.g. text, image_url, input_audio, file."}
        text: {type: string}
      additionalProperties: true
    MessageContent:
      description: Message content — either a plain string or an array of typed content parts.
      oneOf:
        - type: string
        - type: array
          items: {$ref: "#/components/schemas/ContentPart"}
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant, tool], description: Author of the message.}
        content: {$ref: "#/components/schemas/MessageContent"}
        name: {type: string}
        tool_call_id: {type: string}
        tool_calls: {type: array, items: {type: object, additionalProperties: true}}
    ToolDefinition:
      type: object
      description: A tool the model may call (OpenAI function-tool shape).
      properties:
        type: {type: string, default: function}
        function: {type: object, additionalProperties: true}
      additionalProperties: true
    ResponseFormat:
      type: object
      description: Constrains the model's output format.
      properties:
        type: {type: string, enum: [text, json_object, json_schema]}
      additionalProperties: true
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string, description: "Model as \"provider/model\" or a configured alias.", examples: ["openai/gpt-4o"]}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        messages: {type: array, items: {$ref: "#/components/schemas/ChatMessage"}}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number}
        max_tokens: {type: integer}
        stream: {type: boolean, description: "When true, the response streams as OpenAI-compatible SSE."}
        tools: {type: array, items: {$ref: "#/components/schemas/ToolDefinition"}}
        tool_choice: {description: "auto | none | required, or a specific {type, function} selector."}
        response_format: {$ref: "#/components/schemas/ResponseFormat"}
        stop: {type: array, items: {type: string}}
        metadata: {type: object, additionalProperties: {type: string}}
    EmbeddingInput:
      description: Embedding input — a single string or an array of strings.
      oneOf:
        - type: string
        - type: array
          items: {type: string}
    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: {type: string, examples: ["openai/text-embedding-3-small"]}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        input: {$ref: "#/components/schemas/EmbeddingInput"}
        dimensions: {type: integer}
        encoding_format: {type: string, enum: [float, base64]}
        user: {type: string}
    EmbeddingValues:
      description: A single embedding — an array of floats, or a base64 string when encoding_format=base64.
      oneOf:
        - type: array
          items: {type: number}
        - type: string
    EmbeddingData:
      type: object
      required: [object, index, embedding]
      properties:
        object: {type: string}
        index: {type: integer}
        embedding: {$ref: "#/components/schemas/EmbeddingValues"}
    EmbeddingResponse:
      type: object
      required: [object, data, model, usage]
      properties:
        object: {type: string}
        data: {type: array, items: {$ref: "#/components/schemas/EmbeddingData"}}
        model: {type: string}
        usage: {$ref: "#/components/schemas/Usage"}
    TokenCountRequest:
      type: object
      required: [model]
      properties:
        model: {type: string}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        messages: {type: array, items: {$ref: "#/components/schemas/ChatMessage"}}
        input: {description: "Freeform input to count (string or provider-native shape)."}
        tool_context: {description: "Optional tool/function context included in the count."}
        requested_interface: {type: string}
        max_output_tokens: {type: integer}
    TokenCountResponse:
      type: object
      required: [model, input_tokens, output_tokens_estimate, source]
      properties:
        model: {type: string}
        input_tokens: {type: integer}
        output_tokens_estimate: {type: integer}
        source: {type: string, enum: [provider_reported, estimated, unavailable]}
        notes: {type: array, items: {type: string}}
    TranslationInput:
      description: Translation input — a single string or an array of strings.
      oneOf:
        - type: string
        - type: array
          items: {type: string}
    TranslationRequest:
      type: object
      required: [model, input, target_language]
      properties:
        model: {type: string}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        input: {$ref: "#/components/schemas/TranslationInput"}
        target_language: {type: string, examples: ["es"]}
        source_language: {type: string}
        glossary: {type: object, additionalProperties: {type: string}}
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      properties:
        model: {type: string}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        prompt: {type: string}
        n: {type: integer}
        size: {type: string, examples: ["1024x1024"]}
        quality: {type: string}
        style: {type: string}
        response_format: {type: string, enum: [url, b64_json]}
        reference_images: {type: array, items: {type: string}}
    ImageResult:
      type: object
      properties:
        url: {type: string}
        b64_json: {type: string}
        revised_prompt: {type: string}
    ImageResponse:
      type: object
      required: [created, data]
      properties:
        created: {type: integer, format: int64}
        data: {type: array, items: {$ref: "#/components/schemas/ImageResult"}}
    SpeechRequest:
      type: object
      required: [model, input, voice]
      properties:
        model: {type: string}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        input: {type: string, description: Text to synthesize.}
        voice: {type: string}
        response_format: {type: string, examples: ["mp3"]}
        speed: {type: number}
    VideoGenerationRequest:
      type: object
      required: [model, prompt]
      properties:
        model: {type: string}
        routing: {$ref: "#/components/schemas/RoutingOptions"}
        prompt: {type: string}
        duration: {type: integer}
        aspect_ratio: {type: string}
        resolution: {type: string}
        first_frame: {type: string}
        last_frame: {type: string}
        reference_images: {type: array, items: {type: string}}
        reference_videos: {type: array, items: {type: string}}
        with_audio: {type: boolean}
        audio: {type: string}
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [message, type]
          additionalProperties: false
          properties:
            message: {type: string}
            type: {type: string}
            code: {type: string}
            param: {type: string}
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}
        source:
          type: string
          enum: [provider_reported, estimated, unavailable]
    ListResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {}
    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list, model_capabilities.list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        routing:
          $ref: "#/components/schemas/ModelRouting"
    Model:
      type: object
      required: [id, object, modality, capability_flags, lifecycle]
      properties:
        id: {type: string}
        object: {type: string, const: model}
        kind:
          type: string
          enum: [provider_variant, family, alias, selector]
        provider: {type: string}
        provider_variant: {type: string}
        display_name: {type: string}
        family_id: {type: string}
        family_display_name: {type: string}
        status: {type: string}
        verification_class: {type: string}
        modality: {type: string}
        capabilities:
          type: array
          items: {type: string}
        aliases:
          type: array
          items: {type: string}
        capability_flags:
          type: object
          properties:
            chat: {type: boolean}
            vision: {type: boolean}
            file_understanding: {type: boolean}
            image_generation: {type: boolean}
            image_edit: {type: boolean}
            music_generation: {type: boolean}
            lyrics_generation: {type: boolean}
            video_generation: {type: boolean}
            tool_calling: {type: boolean}
            streaming: {type: boolean}
        lifecycle:
          type: object
          properties:
            enabled: {type: boolean}
            status: {type: string}
            stability:
              type: string
              enum: [stable, experimental, deprecated, unknown]
            verification_class: {type: string}
        hosted_tools:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              capability: {type: string}
              resolved_server_side: {type: boolean}
        billing:
          $ref: "#/components/schemas/ModelBilling"
        quota:
          $ref: "#/components/schemas/ModelQuota"
        context_window: {type: integer}
        max_output_tokens: {type: integer}
        max_duration: {type: integer}
        allowed_durations:
          type: array
          items: {type: integer}
        aspect_ratios:
          type: array
          items: {type: string}
        resolutions:
          type: array
          items: {type: string}
        cancelable: {type: boolean}
        voices:
          type: array
          items: {type: string}
        formats:
          type: array
          items: {type: string}
        output_formats:
          type: array
          items: {type: string}
        resolves_to: {type: string}
    ModelBilling:
      type: object
      properties:
        billing_mode:
          type: string
          enum: [usage_based, token_plan, credit, quota, unknown]
        unit: {type: string}
        currency: {type: string}
        source: {type: string}
        effective_from: {type: string}
        effective_until: {type: string}
        notes: {type: string}
        rates:
          type: object
          additionalProperties: {type: number}
        tiers:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {type: number}
        tiered_rates:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              range:
                type: array
                minItems: 2
                maxItems: 2
                items: {type: integer}
              rates:
                type: object
                additionalProperties: {type: number}
        additional_units:
          type: object
          additionalProperties: {type: number}
    ModelQuota:
      type: object
      properties:
        quota_bucket: {type: string}
        unit: {type: string}
        daily_limit:
          type: [number, "null"]
        concurrency_limit:
          type: [integer, "null"]
    ModelRouting:
      type: object
      properties:
        aliases:
          type: array
          items:
            type: object
            properties:
              alias: {type: string}
              target: {type: string}
              resolves_to: {type: string}
              kind: {type: string}
        selectors:
          type: array
          items:
            type: object
            properties:
              alias: {type: string}
              resolves_to: {type: string}
              modality: {type: string}
              capabilities:
                type: array
                items: {type: string}
              providers:
                type: array
                items: {type: string}
              exclude_providers:
                type: array
                items: {type: string}
              statuses:
                type: array
                items: {type: string}
              verification_classes:
                type: array
                items: {type: string}
              prefer:
                type: array
                items: {type: string}
              cost_tier: {type: string}
              latency_tier: {type: string}
        defaults:
          type: object
          additionalProperties:
            type: object
            properties:
              alias: {type: string}
              model: {type: string}
              provider: {type: string}
              modality: {type: string}
              capabilities:
                type: array
                items: {type: string}
    FileObject:
      type: object
      required: [id, object, bytes, created_at, filename, purpose, polaris]
      properties:
        id: {type: string}
        object: {type: string, const: file}
        bytes: {type: integer}
        created_at: {type: integer}
        filename: {type: string}
        purpose: {type: string}
        polaris:
          type: object
          properties:
            sha256: {type: string}
            mime_type: {type: string}
            project_id: {type: string}
            expires_at: {type: integer}
            materialized_providers:
              type: array
              items: {type: string}
            has_inline_bytes: {type: boolean}
            has_blob_backing: {type: boolean}
            origin_url: {type: string}
            content_url: {type: string}
    FileMaterialization:
      type: object
      required: [object, file_id, provider, provider_file_id, purpose, bytes, mime_type, created_at, cached]
      properties:
        object: {type: string, const: file.materialization}
        file_id: {type: string}
        provider: {type: string}
        provider_file_id: {type: string}
        purpose: {type: string}
        bytes: {type: integer}
        mime_type: {type: string}
        created_at: {type: integer}
        expires_at: {type: integer}
        cached: {type: boolean}
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: {type: string}
        object: {type: string}
        created: {type: integer}
        model: {type: string}
        choices: {type: array, items: {type: object}}
        usage:
          $ref: "#/components/schemas/Usage"
        polaris:
          type: object
          properties:
            file_understanding:
              type: object
              properties:
                used: {type: boolean}
                mode:
                  type: string
                  enum: [derived_context, auto_fallback]
                profile:
                  type: string
                  enum: [fast, balanced, quality]
                warning: {type: string}
                artifacts:
                  type: array
                  items:
                    type: object
                    properties:
                      file_id: {type: string}
                      sha256: {type: string}
                      mime_type: {type: string}
                      filename: {type: string}
                      kind: {type: string}
                      processor: {type: string}
                      version: {type: string}
                      source: {type: string}
    AsyncJob:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        job_id: {type: string}
        status: {type: string}
        model: {type: string}
        provider: {type: string}
    SessionDescriptor:
      type: object
      required: [id, client_secret]
      properties:
        id: {type: string}
        client_secret: {type: string}
        websocket_url: {type: string}
        expires_at: {type: string}
    Project:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        created_at: {type: string}
        archived_at: {type: string}
    UsageReport:
      type: object
      required: [total_requests, total_tokens, total_cost_usd]
      properties:
        total_requests: {type: integer}
        total_tokens: {type: integer}
        total_cost_usd: {type: number}
        cost_source_breakdown:
          type: object
          additionalProperties: {type: integer}
